name: xauusd
services:
  api:
    image: ${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:?Set PHX_HOST}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
      PORT: "4000"
      DATABASE_URL: ecto://${POSTGRES_USER:-gold_backend}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xau}
      POOL_SIZE: ${POOL_SIZE:-10}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:1.5b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
      OLLAMA_TRANSLATION_TIMEOUT_MS: ${OLLAMA_TRANSLATION_TIMEOUT_MS:-60000}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-800}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      METALS_DEV_API_KEY: ${METALS_DEV_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://crypto.9nine.tech,https://xau.9nine.tech}
    ports:
      - "127.0.0.1:${HTTP_PORT:-5005}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:4000/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gold_backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xau}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    shm_size: 256mb
volumes:
  postgres_data:
